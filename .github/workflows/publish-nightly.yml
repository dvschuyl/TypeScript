name: Publish nightly

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Nightly tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'microsoft/TypeScript'
    runs-on: ubuntu-latest
    env:
      GH_PAT: ghp_WbZxqsdN0jgTOGEYxzxwRAP9ncURcgS7OLaM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish nightly
        env:
          TAG: ${{ inputs.tag }}
        run: node tools/scripts/nightly-publish.mjs "$TAG"
